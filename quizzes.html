<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quizzes - SmartPass Rwanda</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f7fa;
}

h1{
    text-align:center;
    color:#0066cc;
}

.container{
    width:90%;
    margin:auto;
}

.quiz{
    background:white;
    padding:20px;
    margin:15px 0;
    border-radius:10px;
    box-shadow:0 2px 8px #ccc;
}

button{
    background:#0066cc;
    color:white;
    padding:10px 20px;
    border:0;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#004c99;
}

</style>

</head>


<body>


<h1>🧠 SmartPass Quizzes</h1>


<div class="container" id="quizList">

Loading quizzes...

</div>




<script type="module">


import {db} from "./js/firebase.js";


import {

collection,
getDocs

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const quizList = document.getElementById("quizList");



async function loadQuizzes(){


try{


const snapshot = await getDocs(
collection(db,"quizzes")
);



quizList.innerHTML="";



if(snapshot.empty){

quizList.innerHTML =
"No quizzes available.";

return;

}



snapshot.forEach((doc)=>{


const quiz = doc.data();



console.log("Quiz found:", quiz);



quizList.innerHTML += `


<div class="quiz">


<h2>📝 ${quiz.title}</h2>


<p>
<b>Subject:</b> ${quiz.subject}
</p>


<p>
<b>Class:</b> ${quiz.class}
</p>


<p>
<b>Stream:</b> ${quiz.stream}
</p>


<p>
<b>Topic:</b> ${quiz.topic}
</p>


<p>
<b>Duration:</b> ${quiz.duration} minutes
</p>



<a href="quiz.html?id=${doc.id}">

<button>
Start Quiz
</button>

</a>


</div>


`;



});


}

catch(error){


console.error(error);


quizList.innerHTML =

"Error loading quizzes: " + error.message;


}


}



loadQuizzes();



</script>


</body>

</html>
