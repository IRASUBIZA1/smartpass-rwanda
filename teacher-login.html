<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Login - SmartPass Rwanda</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fa;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-container{
    width:90%;
    max-width:430px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.12);
    text-align:center;
}

.logo{
    font-size:50px;
    margin-bottom:10px;
}

h1{
    color:#0066cc;
    margin-bottom:8px;
}

.subtitle{
    color:#666;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:13px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
}

button{
    width:100%;
    padding:13px;
    margin-top:15px;
    border:none;
    border-radius:7px;
    background:#0066cc;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#004c99;
}

.register{
    margin-top:20px;
    padding:15px;
    background:#f0f6ff;
    border-radius:8px;
}

.register a{
    display:block;
    margin-top:8px;
    color:#0066cc;
    font-weight:bold;
    text-decoration:none;
}

.register a:hover{
    text-decoration:underline;
}

.message{
    margin-top:15px;
    font-weight:bold;
}

.back{
    display:block;
    margin-top:20px;
    color:#555;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="login-container">

    <div class="logo">👨‍🏫</div>

    <h1>Teacher Login</h1>

    <p class="subtitle">
        SmartPass Rwanda Teacher Portal
    </p>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Teacher Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            🔐 Login
        </button>

    </form>

    <p id="message" class="message"></p>

    <div class="register">

        <strong>Are you a new teacher?</strong>

        <a href="teacher-register.html">
            📝 Register as Teacher
        </a>

    </div>

    <a class="back" href="e-learning.html">
        ← Back to E-Learning
    </a>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
};


/* INITIALIZE FIREBASE */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


/* LOGIN */

document
.getElementById("loginForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    message.textContent = "Logging in...";

    try{

        const userCredential =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        message.style.color = "green";

        message.textContent =
            "Login successful! Redirecting...";

        /* GO TO TEACHER DASHBOARD */

        setTimeout(function(){

            window.location.href =
                "teacher.html";

        },1000);

    }

    catch(error){

        console.error(error);

        message.style.color = "red";

        if(error.code === "auth/invalid-credential"){

            message.textContent =
                "Incorrect email or password.";

        }

        else if(error.code === "auth/too-many-requests"){

            message.textContent =
                "Too many login attempts. Please wait and try again.";

        }

        else{

            message.textContent =
                "Login failed: " + error.message;

        }

    }

});

</script>

</body>
</html>
