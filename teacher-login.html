<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Login - SmartPass Rwanda</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#f5f7fa;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:white;
    width:90%;
    max-width:420px;
    padding:35px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.15);
}

.logo{
    text-align:center;
    color:#0066cc;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
    color:#333;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
}

input:focus{
    outline:none;
    border-color:#0066cc;
}

button{
    width:100%;
    padding:13px;
    margin-top:20px;
    border:none;
    border-radius:7px;
    background:#0066cc;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#004c99;
}

.register{
    text-align:center;
    margin-top:20px;
}

.register a{
    color:#0066cc;
    font-weight:bold;
    text-decoration:none;
}

.message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.back{
    text-align:center;
    margin-top:20px;
}

.back a{
    color:#555;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="login-box">

    <h1 class="logo">👨‍🏫 Teacher Login</h1>

    <p class="subtitle">
        SmartPass Rwanda
    </p>

    <form id="loginForm">

        <label for="email">Teacher Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="register">
        Don't have a teacher account?
        <a href="teacher-register.html">
            Register here
        </a>
    </div>

    <div class="back">
        <a href="index.html">
            ← Back to SmartPass Rwanda
        </a>
    </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


// ========================================
// YOUR FIREBASE CONFIGURATION
// ========================================

const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain: "YOUR_PROJECT.firebaseapp.com",

    projectId: "YOUR_PROJECT_ID",

    storageBucket: "YOUR_PROJECT.firebasestorage.app",

    messagingSenderId: "YOUR_SENDER_ID",

    appId: "YOUR_APP_ID"

};


// ========================================
// INITIALIZE FIREBASE
// ========================================

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


// ========================================
// LOGIN
// ========================================

document
.getElementById("loginForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    message.textContent = "Logging in...";

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        message.style.color = "green";

        message.textContent =
            "Login successful! Opening dashboard...";

        setTimeout(function(){

            window.location.href =
                "teacher.html";

        },1000);

    }

    catch(error){

        console.error(error);

        message.style.color = "red";

        if(error.code === "auth/invalid-credential"){

            message.textContent =
                "Incorrect email or password.";

        }

        else if(error.code === "auth/too-many-requests"){

            message.textContent =
                "Too many login attempts. Please wait and try again.";

        }

        else{

            message.textContent =
                "Login failed: " + error.message;

        }

    }

});

</script>

</body>
</html>
