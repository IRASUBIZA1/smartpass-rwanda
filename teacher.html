<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Panel - SmartPass Rwanda</title>

<style>

body{
font-family:Arial;
background:#f5f7fa;
}

.container{
width:90%;
margin:auto;
}

.card{
background:white;
padding:20px;
margin:20px 0;
border-radius:10px;
box-shadow:0 2px 8px #ccc;
}

input,select{
width:100%;
padding:10px;
margin:8px 0;
}

button{
background:#0066cc;
color:white;
border:0;
padding:12px 20px;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#004c99;
}

</style>

</head>


<body>


<div class="container">


<h1>👨‍🏫 SmartPass Teacher Panel</h1>


<div class="card">


<h2>Create Quiz</h2>


<input id="title" placeholder="Quiz title">


<input id="subject" placeholder="Subject">


<input id="className" placeholder="Class (Example S6)">


<input id="topic" placeholder="Topic">


<input id="duration" type="number" placeholder="Duration minutes">


<button id="createQuiz">
Create Quiz
</button>


<p id="quizMessage"></p>


</div>




<div class="card">


<h2>Add Question</h2>


<input id="question" placeholder="Question">


<input id="optionA" placeholder="Option A">


<input id="optionB" placeholder="Option B">


<input id="optionC" placeholder="Option C">


<input id="optionD" placeholder="Option D">


<select id="answer">

<option value="A">Answer A</option>
<option value="B">Answer B</option>
<option value="C">Answer C</option>
<option value="D">Answer D</option>

</select>


<input id="quizId" placeholder="Paste Quiz ID here">


<button id="addQuestion">
Save Question
</button>


<p id="questionMessage"></p>


</div>


</div>




<script type="module">


import {db, auth} from "./js/firebase.js";


import {

onAuthStateChanged

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

collection,
addDoc

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



// 🔒 Teacher protection

onAuthStateChanged(auth,(user)=>{

if(!user){

window.location.href="teacher-login.html";

}

});




// Create Quiz


document.getElementById("createQuiz").onclick = async()=>{


try{


const quiz = await addDoc(

collection(db,"quizzes"),

{


title:
document.getElementById("title").value,


subject:
document.getElementById("subject").value,


class:
document.getElementById("className").value,


topic:
document.getElementById("topic").value,


duration:
Number(document.getElementById("duration").value),


status:"active",


stream:"all"


}

);



document.getElementById("quizId").value = quiz.id;



document.getElementById("quizMessage").innerHTML =

"✅ Quiz created. ID: "+quiz.id;



}


catch(error){


document.getElementById("quizMessage").innerHTML =
error.message;


}


};






// Add Question


document.getElementById("addQuestion").onclick = async()=>{


try{


await addDoc(

collection(db,"questions"),

{


quizId:
document.getElementById("quizId").value,


question:
document.getElementById("question").value,


optionA:
document.getElementById("optionA").value,


optionB:
document.getElementById("optionB").value,


optionC:
document.getElementById("optionC").value,


optionD:
document.getElementById("optionD").value,


answer:
document.getElementById("answer").value


}

);



document.getElementById("questionMessage").innerHTML =

"✅ Question saved successfully";


}


catch(error){


document.getElementById("questionMessage").innerHTML =
error.message;


}


};



</script>


</body>

</html>
