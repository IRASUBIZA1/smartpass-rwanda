<!DOCTYPE html>
<html>
<head>
<title>Teacher Test Upload - SmartPass Rwanda</title>

<style>
body{
    font-family: Arial;
    margin: 30px;
}

textarea{
    width: 100%;
    height: 350px;
}

input, select{
    width: 300px;
    padding: 8px;
}

button{
    padding: 12px 25px;
    background: green;
    color: white;
    border: none;
    cursor: pointer;
}
</style>

</head>

<body>

<h1>👩‍🏫 SmartPass Rwanda Teacher Dashboard</h1>

<h3>Create Examination</h3>


<label>Subject</label><br>

<select id="subject">

<option>Biology</option>
<option>Chemistry</option>
<option>Mathematics</option>
<option>Physics</option>
<option>English</option>
<option>Geography</option>

</select>

<br><br>


<label>Level</label><br>

<select id="level">

<option>S1</option>
<option>S2</option>
<option>S3</option>
<option>S4</option>
<option>S5</option>
<option>S6</option>

</select>

<br><br>


<label>Term</label><br>

<select id="term">

<option>Term 1</option>
<option>Term 2</option>
<option>Term 3</option>

</select>

<br><br>


<label>Duration</label><br>

<input id="duration" placeholder="Example: 1 hour">

<br><br>


<h3>Paste Full Test Here</h3>


<textarea id="testText"
placeholder="Paste 15 or more questions here..."></textarea>


<br><br>


<button onclick="uploadTest()">
Upload Test
</button>



<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import {
getFirestore,
collection,
addDoc
} 
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyDCrBUVGFHD2Qu3KStXKOKw7bJFffQSHQ8",

authDomain: "smartpass-rwanda.firebaseapp.com",

projectId: "smartpass-rwanda",

storageBucket: "smartpass-rwanda.firebasestorage.app",

messagingSenderId: "358453346236",

appId: "1:358453346236:web:c0e8263ea09a0b311af5b9"

};



const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



window.uploadTest = async function(){


let test = document.getElementById("testText").value;


await addDoc(collection(db,"tests"),{


subject:
document.getElementById("subject").value,


level:
document.getElementById("level").value,


term:
document.getElementById("term").value,


duration:
document.getElementById("duration").value,


content:test,


createdAt:new Date()


});


alert("✅ Test uploaded successfully!");

}


</script>


</body>
</html>
