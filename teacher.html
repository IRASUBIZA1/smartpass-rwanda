<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Panel - SmartPass Rwanda</title>

<style>

body{
font-family:Arial;
background:#f5f7fa;
}

.container{
width:90%;
margin:auto;
}

.card{
background:white;
padding:20px;
margin:20px 0;
border-radius:10px;
box-shadow:0 2px 8px #ccc;
}

input,select{
width:100%;
padding:10px;
margin:8px 0;
}

button{
background:#0066cc;
color:white;
border:0;
padding:12px 20px;
border-radius:5px;
cursor:pointer;
}

</style>

</head>


<body>


<div class="container">


<h1>👨‍🏫 SmartPass Teacher Panel</h1>


<div class="card">


<h2>Create Quiz</h2>


<input id="title" placeholder="Quiz title">


<input id="subject" placeholder="Subject">


<input id="class" placeholder="Class (Example S6)">


<input id="topic" placeholder="Topic">


<input id="duration" type="number" placeholder="Duration minutes">


<button id="createQuiz">
Create Quiz
</button>


<p id="quizMessage"></p>


</div>





<div class="card">


<h2>Add Question</h2>


<input id="question" placeholder="Question">


<input id="optionA" placeholder="Option A">


<input id="optionB" placeholder="Option B">


<input id="optionC" placeholder="Option C">


<input id="optionD" placeholder="Option D">


<select id="answer">

<option value="A">Answer A</option>
<option value="B">Answer B</option>
<option value="C">Answer C</option>
<option value="D">Answer D</option>

</select>


<input id="quizId" placeholder="Quiz ID">


<button id="addQuestion">
Save Question
</button>


<p id="questionMessage"></p>


</div>



</div>




<script type="module">


import {db} from "./js/firebase.js";


import {

collection,
addDoc

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";





let currentQuizId="";





document.getElementById("createQuiz").onclick = async()=>{


let doc = await addDoc(

collection(db,"quizzes"),

{

title:title.value,

subject:subject.value,

class:class.value,

topic:topic.value,

duration:Number(duration.value),

status:"active",

stream:"all"

}

);



currentQuizId = doc.id;


document.getElementById("quizId").value = doc.id;


document.getElementById("quizMessage").innerHTML =

"Quiz created. ID: "+doc.id;


};






document.getElementById("addQuestion").onclick = async()=>{


await addDoc(

collection(db,"questions"),

{


quizId:quizId.value,

question:question.value,

optionA:optionA.value,

optionB:optionB.value,

optionC:optionC.value,

optionD:optionD.value,

answer:answer.value


}

);



document.getElementById("questionMessage").innerHTML=

"Question saved successfully";


};



</script>


</body>

</html>
