<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - SmartPass Rwanda 🇷🇼</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fa;
}

.container{
    width:350px;
    max-width:90%;
    margin:50px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 2px 8px #ccc;
}

h2{
    text-align:center;
    color:#0066cc;
}

input,
select{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    background:#0066cc;
    color:white;
    padding:12px;
    border:0;
    cursor:pointer;
    border-radius:5px;
    margin-top:10px;
    font-weight:bold;
}

button:hover{
    background:#004c99;
}

#message{
    text-align:center;
    margin-top:15px;
}

</style>

</head>


<body>


<div class="container">

<h2>🎓 Student Registration</h2>


<input
    id="name"
    type="text"
    placeholder="Full Name"
    required
>


<input
    id="email"
    type="email"
    placeholder="Email"
    required
>


<input
    id="password"
    type="password"
    placeholder="Password"
    required
>


<select id="class">

<option value="S5">S5</option>
<option value="S6">S6</option>

</select>


<select id="stream">

<option value="MCB">MCB</option>
<option value="PCB">PCB</option>
<option value="MPCB">MPCB</option>

</select>


<button id="register">
Create Account
</button>


<p id="message"></p>


</div>


<script type="module">

import { auth, db } from "./js/firebase.js";


import {
    createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    doc,
    setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


document.getElementById("register").onclick = async function(){


    const name =
        document.getElementById("name").value.trim();


    const email =
        document.getElementById("email").value.trim();


    const password =
        document.getElementById("password").value;


    const studentClass =
        document.getElementById("class").value;


    const stream =
        document.getElementById("stream").value;


    const message =
        document.getElementById("message");


    /* CHECK EMPTY FIELDS */

    if(!name || !email || !password){

        message.innerHTML =
        "Please fill in all fields.";

        return;

    }


    /* CHECK PASSWORD */

    if(password.length < 6){

        message.innerHTML =
        "Password must be at least 6 characters.";

        return;

    }


    try{


        message.innerHTML =
        "Creating your account...";


        /* CREATE FIREBASE ACCOUNT */

        const userCredential =
        await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );


        const user =
        userCredential.user;


        /* SAVE STUDENT INFORMATION */

        await setDoc(
            doc(db, "users", user.uid),
            {

                name: name,

                email: email,

                role: "student",

                class: studentClass,

                stream: stream,

                createdAt: new Date()

            }
        );


        /* SUCCESS */

        message.innerHTML =
        "Registration successful ✅";


        /*
        SEND STUDENT TO DASHBOARD
        */

        setTimeout(function(){

            window.location.href =
            "student-dashboard.html";

        }, 800);


    }


    catch(error){


        console.error(error);


        let errorMessage =
        "Registration failed.";


        if(error.code === "auth/email-already-in-use"){

            errorMessage =
            "This email is already registered. Please log in.";

        }


        else if(error.code === "auth/invalid-email"){

            errorMessage =
            "Please enter a valid email address.";

        }


        else if(error.code === "auth/weak-password"){

            errorMessage =
            "Password must be at least 6 characters.";

        }


        else if(error.code === "permission-denied"){

            errorMessage =
            "Database permission denied. Check Firestore Rules.";

        }


        else{

            errorMessage =
            error.message;

        }


        message.innerHTML =
        "❌ " + errorMessage;


    }

};

</script>


</body>

</html>
