<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Registration - SmartPass Rwanda</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fa;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:90%;
    max-width:430px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.12);
    text-align:center;
}

.logo{
    font-size:50px;
    margin-bottom:10px;
}

h1{
    color:#0066cc;
    margin-bottom:8px;
}

.subtitle{
    color:#666;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:13px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
}

button{
    width:100%;
    padding:13px;
    margin-top:15px;
    border:none;
    border-radius:7px;
    background:#0066cc;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#004c99;
}

.message{
    margin-top:15px;
    font-weight:bold;
}

.login{
    margin-top:20px;
}

.login a{
    color:#0066cc;
    font-weight:bold;
    text-decoration:none;
}

.back{
    display:block;
    margin-top:20px;
    color:#555;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">👨‍🏫</div>

    <h1>Teacher Registration</h1>

    <p class="subtitle">
        Create your SmartPass Rwanda teacher account
    </p>

    <form id="registerForm">

        <input
            type="text"
            id="name"
            placeholder="Teacher Name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Teacher Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            minlength="6"
            required
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
            minlength="6"
            required
        >

        <button type="submit">
            📝 Create Teacher Account
        </button>

    </form>

    <p id="message" class="message"></p>

    <div class="login">
        Already have an account?
        <a href="teacher-login.html">
            Login
        </a>
    </div>

    <a class="back" href="e-learning.html">
        ← Back to E-Learning
    </a>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    updateProfile
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* YOUR FIREBASE CONFIG */

const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
};


/* INITIALIZE FIREBASE */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


/* REGISTRATION */

document
.getElementById("registerForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("message");


    if(password !== confirmPassword){

        message.style.color = "red";

        message.textContent =
            "Passwords do not match.";

        return;
    }


    message.style.color = "#0066cc";

    message.textContent =
        "Creating teacher account...";


    try{

        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        await updateProfile(
            userCredential.user,
            {
                displayName:name
            }
        );


        message.style.color = "green";

        message.textContent =
            "Teacher account created successfully!";


        setTimeout(function(){

            window.location.href =
                "teacher.html";

        },1500);


    }
    catch(error){

        console.error(error);

        message.style.color = "red";


        if(error.code === "auth/email-already-in-use"){

            message.textContent =
                "This email is already registered.";

        }

        else if(error.code === "auth/weak-password"){

            message.textContent =
                "Password must contain at least 6 characters.";

        }

        else{

            message.textContent =
                "Registration failed: " + error.message;

        }

    }

});

</script>

</body>
</html>
